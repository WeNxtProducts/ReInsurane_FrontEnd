<!-- Toggle Button -->
<button class="toggle-btn" (click)="toggleSidebar()">
  <i class="fas fa-bars"></i>
</button>

<!-- Sidebar -->
<div class="sidebar" [class.active]="isSidebarOpen">
  <div class="logo">
    <img src="assets/logo.png" alt="Logo">
  </div>

  <ul class="menu">
    <li *ngFor="let item of menuItems"><a [routerLink]="item.path" (click)="closeSidebar()"><i [class]="item.icon"></i> {{item.name}}</a></li>
  </ul>

  <div class="support">
    <button class="support-btn" (click)="closeSidebar()">Support</button>
  </div>
</div>
