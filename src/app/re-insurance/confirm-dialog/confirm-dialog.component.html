<h2 mat-dialog-title>Approval Confirmation</h2>
<mat-dialog-content>
 <strong>Approve Date : {{ date }}</strong>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button color="warn" (click)="onCancel()">Cancel</button>
  <button mat-button color="primary" (click)="onConfirm()">Approve</button>
</mat-dialog-actions>
<app-loading *ngIf="loadingCheck" ></app-loading>
